<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>校园每日快讯 · 中国农业大学</title>
  <meta name="description" content="中国农业大学公开通知与新闻的每日汇编，自动生成 Word 日报。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">讯</div>
      <div class="brand-text">
        <h1>校园每日快讯</h1>
        <p>中国农业大学 · 公开消息每日汇编</p>
      </div>
    </div>
    <div class="actions">
      <div class="today" id="todayPill">—</div>
      <span class="live-badge"><i></i>自动更新</span>
      <button class="btn ghost" id="btnRefresh" type="button" title="重新加载页面">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        刷新
      </button>
    </div>
  </header>

  <div class="stale" id="staleBar" hidden><span></span></div>

  <main class="layout">
    <section class="card feed">
      <div class="feed-head">
        <div class="feed-title">
          <h2>消息流</h2>
          <p class="muted small" id="feedMeta">正在加载…</p>
        </div>
        <nav class="chips" id="dayChips"></nav>
      </div>
      <div class="filters">
        <span class="filter-label">分类</span>
        <nav class="chips chips-sm" id="catChips"></nav>
      </div>
      <div id="newsList" class="news-list">
        <div class="empty"><div class="spinner"></div>正在加载…</div>
      </div>
    </section>

    <aside class="side">
      <section class="card digest-card" id="digestCard"></section>

      <section class="card">
        <div class="card-head">
          <h3>历史日报</h3>
          <span class="muted small" id="docCount"></span>
        </div>
        <div class="history" id="historyList"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h3>更新说明</h3>
        </div>
        <div class="note">
          <p>页面由 GitHub Actions 自动更新，每天 <strong>07:20 / 12:10 / 18:10 / 22:10</strong>（北京时间）各抓取一次。</p>
          <p>数据来自学校公开的通知公告与新闻网，无需登录，也不需要有人开着电脑。</p>
          <p class="muted">数据生成于 <span id="updatedAt">—</span></p>
        </div>
        <div class="sources" id="sourceList"></div>
      </section>
    </aside>
  </main>

  <footer class="site-foot">
    <span>校园每日快讯</span><span class="sep">·</span>
    <span>数据来自中国农业大学公开页面</span><span class="sep">·</span>
    <span>仅供学习交流</span>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
