name: 每日更新

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "state/**"
      - "scripts/**"
      - "core/**"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
  schedule:
    # GitHub Actions 的 cron 用 UTC 时间，以下对应北京时间
    - cron: "20 23 * * *"   # 07:20
    - cron: "10 4 * * *"    # 12:10
    - cron: "10 10 * * *"   # 18:10
    - cron: "10 14 * * *"   # 22:10
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并生成静态站
        run: python scripts/build_site.py

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 保存抓取状态和日报
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs
          if git diff --cached --quiet; then
            echo "没有新变化"
          else
            git commit -m "自动更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
